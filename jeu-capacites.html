<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capacités — PokéQuiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PokéQuiz — Monde des Ombres · styles partagés (thème Giratina)
   ============================================================ */
:root{
  --void:#050508; --shadow-deep:#0a0a14; --shadow-mid:#121225; --shadow-light:#1e1e3a;
  --gira-gold:#c8a84b; --gira-gold-bright:#f0cc6e;
  --gira-purple:#5a3fa0; --gira-purple-bright:#8a6fd0;
  --gira-teal:#2aa8c4; --gira-teal-bright:#4fcfea;
  --gira-crimson:#8b1a3a;
  --text-primary:#e8e0f0; --text-secondary:#a090c0; --text-muted:#604880;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--text-primary);font-family:'Crimson Pro',Georgia,serif;overflow-x:hidden;min-height:100vh}
#void-canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.6}
.screen{display:none;position:relative;z-index:1}
.screen.active{display:block}
a{color:var(--gira-teal-bright);text-decoration:none}

/* corners + sound toggle */
.menu-corner{position:fixed;font-size:1.5rem;opacity:.12;pointer-events:none;animation:cg 3s ease-in-out infinite;z-index:2}
@keyframes cg{0%,100%{opacity:.08}50%{opacity:.25}}
.menu-corner.tl{top:1.5rem;left:1.5rem}.menu-corner.tr{top:1.5rem;right:1.5rem;transform:scaleX(-1)}
.menu-corner.bl{bottom:1.5rem;left:1.5rem;transform:scaleY(-1)}.menu-corner.br{bottom:1.5rem;right:1.5rem;transform:scale(-1)}
.sound-toggle{position:fixed;top:1.2rem;right:1.2rem;z-index:50;background:var(--shadow-deep);border:1px solid var(--gira-purple);color:var(--gira-gold);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .25s}
.sound-toggle:hover{border-color:var(--gira-gold);box-shadow:0 0 16px rgba(200,168,75,.3)}

/* typography helpers */
.menu-title{font-family:'Cinzel Decorative',serif;font-size:clamp(2rem,5vw,3.6rem);font-weight:900;text-align:center;position:relative;z-index:2;line-height:1;letter-spacing:.05em;background:linear-gradient(135deg,var(--gira-gold) 0%,var(--gira-teal-bright) 40%,var(--gira-gold-bright) 70%,var(--gira-purple-bright) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 20px rgba(200,168,75,.4));animation:shimmer 3s linear infinite;background-size:200% 200%}
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.menu-subtitle{font-style:italic;font-size:1.2rem;color:var(--text-secondary);text-align:center;margin-top:.4rem;margin-bottom:.5rem;position:relative;z-index:2;letter-spacing:.12em}
.menu-runes{font-family:'Cinzel Decorative',serif;font-size:.7rem;color:var(--text-muted);letter-spacing:.4em;text-transform:uppercase;margin-bottom:1.5rem;position:relative;z-index:2;animation:rune 4s ease-in-out infinite}
@keyframes rune{0%,100%{opacity:.4}50%{opacity:.9}}
.sec-title{font-family:'Cinzel Decorative',serif;font-size:.7rem;letter-spacing:.3em;color:var(--text-muted);text-transform:uppercase;text-align:center;margin-bottom:.4rem}
.sec-head{font-family:'Cinzel Decorative',serif;font-size:clamp(1.4rem,3vw,2rem);font-weight:700;text-align:center;color:var(--text-primary);margin-bottom:.4rem}
.sec-sub{font-style:italic;color:var(--text-secondary);text-align:center;margin-bottom:1.6rem;font-size:1rem;max-width:560px;margin-left:auto;margin-right:auto}
.sep{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gira-gold),transparent);margin:1rem auto}

/* halo */
.menu-halo{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);width:640px;height:640px;max-width:95vw;background:radial-gradient(ellipse,rgba(90,63,160,.15) 0%,rgba(5,5,8,0) 70%);pointer-events:none;z-index:0;animation:halo 4s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}

/* hub menu grid */
#screen-menu{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem}
.giratina-wrap{position:relative;z-index:2;width:240px;height:240px;margin-bottom:.5rem;filter:drop-shadow(0 0 30px rgba(90,63,160,.5)) drop-shadow(0 0 60px rgba(42,168,196,.2))}
.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;width:100%;max-width:560px;position:relative;z-index:2}
.menu-btn{position:relative;display:block;background:transparent;border:1px solid var(--gira-purple);border-radius:4px;padding:1.2rem 1rem;cursor:pointer;overflow:hidden;transition:all .3s;text-align:center;color:inherit}
.menu-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--gira-purple),var(--gira-teal));opacity:0;transition:opacity .3s}
.menu-btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(200,168,75,.15),transparent);transition:left .5s}
.menu-btn:hover::before{opacity:.15}.menu-btn:hover::after{left:100%}
.menu-btn:hover{border-color:var(--gira-gold);transform:translateY(-3px);box-shadow:0 8px 30px rgba(90,63,160,.4),0 0 20px rgba(200,168,75,.2)}
.menu-btn .pic{font-size:1.7rem;position:relative;z-index:1;display:block;margin-bottom:.3rem}
.menu-btn .bn{font-family:'Cinzel Decorative',serif;font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--gira-gold);position:relative;z-index:1;display:block}
.menu-btn .bd{font-size:.8rem;color:var(--text-secondary);font-style:italic;position:relative;z-index:1;line-height:1.3;display:block;margin-top:.2rem}
.menu-btn .badge{position:absolute;top:6px;right:6px;font-family:'Cinzel Decorative',serif;font-size:.5rem;letter-spacing:.1em;padding:2px 6px;border-radius:2px;z-index:2}
.badge-new{background:rgba(200,168,75,.2);color:var(--gira-gold);border:.5px solid var(--gira-gold)}
.badge-hard{background:rgba(139,26,58,.3);color:#ff8080;border:.5px solid var(--gira-crimson)}
.badge-music{background:rgba(42,168,196,.2);color:var(--gira-teal-bright);border:.5px solid var(--gira-teal)}

/* app container (each game) */
#app{position:relative;z-index:1}

/* start / select screen */
.start-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem}
.mode-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;width:100%;max-width:780px;margin-bottom:1.5rem}
.mode-card{background:var(--shadow-deep);border:1px solid var(--shadow-light);border-radius:6px;padding:1.4rem;cursor:pointer;transition:all .3s;text-align:center;position:relative;overflow:hidden}
.mode-card:hover{border-color:var(--gira-purple-bright);transform:translateY(-4px);box-shadow:0 10px 30px rgba(90,63,160,.4)}
.mode-card.infinite{border-color:var(--gira-gold)}.mode-card.infinite:hover{box-shadow:0 10px 30px rgba(200,168,75,.4)}
.mode-card.survie{border-color:var(--gira-crimson)}.mode-card.survie:hover{box-shadow:0 10px 30px rgba(139,26,58,.4)}
.mode-card .mi{font-size:2.2rem;margin-bottom:.4rem;display:block}
.mode-card .mn{font-family:'Cinzel Decorative',serif;font-size:.76rem;font-weight:700;color:var(--gira-gold);letter-spacing:.06em;margin-bottom:.4rem}
.mode-card .md{font-size:.85rem;color:var(--text-secondary);font-style:italic;line-height:1.4}

/* game screen */
.game-wrap{min-height:100vh;padding:1.5rem 1rem;max-width:720px;margin:0 auto}
.game-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem;padding-bottom:1rem;border-bottom:.5px solid var(--gira-purple);flex-wrap:wrap;gap:.6rem}
.back-btn{background:transparent;border:.5px solid var(--text-muted);color:var(--text-secondary);padding:.4rem .9rem;border-radius:3px;cursor:pointer;font-family:'Crimson Pro',serif;font-size:.9rem;transition:all .2s}
.back-btn:hover{border-color:var(--gira-gold);color:var(--gira-gold)}
.game-info{display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
.chip{font-family:'Cinzel Decorative',serif;font-size:.55rem;letter-spacing:.1em;color:var(--text-secondary)}
.chip span{display:block;font-size:1.05rem;color:var(--gira-gold);margin-top:2px}
.chip.lives span{color:#ff7a7a}
.chip.timer span{color:var(--gira-teal-bright)}
.streak-badge{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .6rem;border-radius:20px;background:rgba(200,168,75,.1);border:.5px solid rgba(200,168,75,.3);font-family:'Cinzel Decorative',serif;font-size:.55rem;color:var(--gira-gold);letter-spacing:.08em}
.progress-wrap{width:100%;height:3px;background:var(--shadow-light);border-radius:2px;margin-bottom:1.4rem;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gira-purple),var(--gira-teal));border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.progress-fill.timer{background:linear-gradient(90deg,var(--gira-teal),var(--gira-gold));transition:width 1s linear}

/* question card */
.q-card{background:var(--shadow-deep);border:1px solid var(--shadow-light);border-radius:6px;padding:2rem 1.5rem;margin-bottom:1.5rem;position:relative;overflow:hidden;animation:cardin .4s ease-out}
@keyframes cardin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gira-purple),var(--gira-teal),var(--gira-gold))}
.q-badge{display:inline-flex;align-items:center;gap:.5rem;padding:.3rem .8rem;border-radius:3px;font-size:.72rem;font-family:'Cinzel Decorative',serif;letter-spacing:.06em;margin-bottom:1rem}
.q-tlabel{font-size:.72rem;color:var(--text-muted);font-style:italic;letter-spacing:.1em;margin-bottom:.8rem}
.q-text{font-size:1.3rem;font-weight:600;line-height:1.5;color:var(--text-primary);margin-bottom:.4rem}

/* sprite stage */
.q-sprite-stage{display:flex;align-items:center;justify-content:center;min-height:160px;margin:.6rem auto}
.q-sprite{width:160px;height:160px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 0 18px rgba(90,63,160,.6));transition:filter .6s,transform .6s}
.q-sprite.silhouette{filter:brightness(0) saturate(0) drop-shadow(0 0 14px rgba(90,63,160,.7))}
.q-sprite.reveal{animation:reveal .7s ease-out}
@keyframes reveal{0%{transform:scale(.7) rotate(-6deg);filter:brightness(2) drop-shadow(0 0 30px var(--gira-gold))}100%{transform:scale(1) rotate(0);filter:drop-shadow(0 0 18px rgba(90,63,160,.6))}}

/* music */
.music-stage{display:flex;flex-direction:column;align-items:center;gap:1rem;margin:1rem auto}
.equalizer{display:flex;align-items:flex-end;gap:4px;height:64px}
.equalizer .bar{width:6px;background:linear-gradient(to top,var(--gira-purple),var(--gira-teal-bright));border-radius:3px 3px 0 0;height:10px;transition:height .12s ease}
.play-track-btn{background:transparent;border:1px solid var(--gira-teal);color:var(--gira-teal-bright);padding:.5rem 1.2rem;border-radius:4px;cursor:pointer;font-family:'Cinzel Decorative',serif;font-size:.65rem;letter-spacing:.12em;transition:all .25s}
.play-track-btn:hover{background:rgba(42,168,196,.1);box-shadow:0 0 16px rgba(42,168,196,.3)}

/* answers */
.answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.answer-btn{background:var(--shadow-mid);border:1px solid var(--shadow-light);border-radius:4px;padding:.9rem 1rem;cursor:pointer;text-align:left;transition:all .25s;font-family:'Crimson Pro',serif;font-size:1rem;color:var(--text-primary);position:relative;overflow:hidden}
.answer-btn .al{font-family:'Cinzel Decorative',serif;font-size:.6rem;color:var(--text-muted);display:block;margin-bottom:3px;letter-spacing:.1em}
.answer-btn:hover:not(:disabled){border-color:var(--gira-purple-bright);background:rgba(90,63,160,.15);transform:translateY(-2px);box-shadow:0 4px 20px rgba(90,63,160,.3)}
.answer-btn.correct{border-color:var(--gira-teal);background:rgba(42,168,196,.15);box-shadow:0 0 20px rgba(42,168,196,.4)}
.answer-btn.wrong{border-color:var(--gira-crimson);background:rgba(139,26,58,.2);box-shadow:0 0 20px rgba(139,26,58,.3)}
.answer-btn:disabled{cursor:default}

/* hint + feedback + next */
.hint-row{margin-top:1rem;display:flex;justify-content:center}
.hint-btn{background:transparent;border:1px dashed var(--gira-purple-bright);color:var(--gira-purple-bright);padding:.45rem 1rem;border-radius:4px;cursor:pointer;font-family:'Cinzel Decorative',serif;font-size:.6rem;letter-spacing:.1em;transition:all .25s}
.hint-btn:hover{background:rgba(138,111,208,.12)}
.hint-text{margin-top:.8rem;text-align:center;font-style:italic;color:var(--gira-purple-bright);font-size:.95rem}
.feedback{min-height:50px;padding:1rem;border-radius:4px;margin-top:1rem;display:none;animation:cardin .3s ease-out}
.feedback.correct{display:block;background:rgba(42,168,196,.08);border:1px solid rgba(42,168,196,.3);color:var(--gira-teal-bright)}
.feedback.wrong{display:block;background:rgba(139,26,58,.08);border:1px solid rgba(139,26,58,.3);color:#ff9090}
.feedback .fl{font-family:'Cinzel Decorative',serif;font-size:.62rem;letter-spacing:.15em;margin-bottom:.4rem;display:block}
.feedback .ft{font-size:.95rem;line-height:1.5}
.next-btn{display:none;width:100%;margin-top:1rem;background:transparent;border:1px solid var(--gira-gold);color:var(--gira-gold);padding:.8rem;border-radius:4px;cursor:pointer;font-family:'Cinzel Decorative',serif;font-size:.72rem;letter-spacing:.15em;transition:all .25s}
.next-btn:hover{background:rgba(200,168,75,.1);box-shadow:0 0 20px rgba(200,168,75,.2)}

/* results */
.results-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1rem;text-align:center}
.orb{width:140px;height:140px;border-radius:50%;border:2px solid var(--gira-gold);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 1.5rem;animation:orb 2s ease-in-out infinite;box-shadow:0 0 40px rgba(200,168,75,.3),inset 0 0 30px rgba(90,63,160,.3)}
@keyframes orb{0%,100%{box-shadow:0 0 40px rgba(200,168,75,.3),inset 0 0 30px rgba(90,63,160,.3)}50%{box-shadow:0 0 60px rgba(200,168,75,.5),inset 0 0 40px rgba(90,63,160,.5)}}
.orb .big{font-family:'Cinzel Decorative',serif;font-size:2.6rem;font-weight:900;color:var(--gira-gold-bright);line-height:1}
.orb .sub{font-size:.65rem;color:var(--text-muted);letter-spacing:.15em;font-family:'Cinzel Decorative',serif}
.res-title{font-family:'Cinzel Decorative',serif;font-size:1.5rem;font-weight:700;color:var(--text-primary);margin-bottom:.5rem}
.res-flavor{font-style:italic;color:var(--text-secondary);font-size:1rem;margin-bottom:2rem;max-width:420px}
.res-break{display:flex;gap:1.8rem;justify-content:center;margin-bottom:2rem;flex-wrap:wrap}
.bi{text-align:center}.bi .num{font-family:'Cinzel Decorative',serif;font-size:1.8rem;display:block}
.bi .lbl{font-size:.7rem;color:var(--text-muted);letter-spacing:.12em;font-family:'Cinzel Decorative',serif}
.res-btns{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.res-btn{padding:.8rem 1.6rem;border-radius:4px;cursor:pointer;font-family:'Cinzel Decorative',serif;font-size:.62rem;letter-spacing:.12em;transition:all .25s;text-decoration:none;display:inline-block}
.res-btn.primary{background:var(--gira-purple);border:1px solid var(--gira-purple-bright);color:var(--text-primary)}
.res-btn.primary:hover{background:var(--gira-purple-bright);box-shadow:0 0 20px rgba(138,111,208,.5)}
.res-btn.secondary{background:transparent;border:1px solid var(--text-muted);color:var(--text-secondary)}
.res-btn.secondary:hover{border-color:var(--gira-gold);color:var(--gira-gold)}

/* sparkles */
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:100}
.sparkle{position:absolute;width:4px;height:4px;border-radius:50%;animation:spk .8s ease-out forwards}
@keyframes spk{0%{transform:scale(1) translate(0,0);opacity:1}100%{transform:scale(0) translate(var(--tx),var(--ty));opacity:0}}

/* type chips (type game) */
.type-chip{display:inline-block;padding:.25rem .7rem;border-radius:20px;font-size:.7rem;font-family:'Cinzel Decorative',serif;letter-spacing:.05em;margin:.15rem}
.type-ref{max-width:560px;margin:0 auto 1rem;text-align:center;line-height:2}

/* jukebox (music game) */
.jukebox{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:1rem auto;max-width:520px}
.juke-btn{background:var(--shadow-mid);border:1px solid var(--gira-purple);color:var(--text-primary);padding:.5rem 1rem;border-radius:4px;cursor:pointer;font-family:'Cinzel Decorative',serif;font-size:.6rem;letter-spacing:.08em;transition:all .25s}
.juke-btn:hover{border-color:var(--gira-teal);color:var(--gira-teal-bright)}
.juke-btn.active{border-color:var(--gira-gold);color:var(--gira-gold);box-shadow:0 0 14px rgba(200,168,75,.25)}

@media (max-width:520px){.answers-grid{grid-template-columns:1fr}.menu-grid{grid-template-columns:1fr;max-width:320px}}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   PokéQuiz — Monde des Ombres · couche partagée
   Données, audio chiptune, particules, helpers, moteur de quiz
   ============================================================ */

/* ---------- décor commun (corners + particules + bouton son) ---------- */
(function decor(){
  function add(){
    if(!document.querySelector('.menu-corner')){
      ['tl','tr','bl','br'].forEach(p=>{const d=document.createElement('div');d.className='menu-corner '+p;d.innerHTML='&#10022;';document.body.appendChild(d);});
    }
    if(!document.getElementById('void-canvas')){
      const c=document.createElement('canvas');c.id='void-canvas';document.body.prepend(c);
    }
    if(!document.getElementById('sparkles')){
      const s=document.createElement('div');s.className='sparkles';s.id='sparkles';document.body.appendChild(s);
    }
    if(!document.getElementById('sound-toggle')){
      const b=document.createElement('button');b.className='sound-toggle';b.id='sound-toggle';b.title='Activer/couper le son';b.innerHTML='&#9834;';
      document.body.appendChild(b);
      b.addEventListener('click',()=>{const on=!Audio8.isEnabled();Audio8.setEnabled(on);b.innerHTML=on?'&#9834;':'&#128263;';b.style.opacity=on?'1':'.5';});
    }
    initParticles();
  }
  function initParticles(){
    const c=document.getElementById('void-canvas');if(!c)return;const x=c.getContext('2d');let P=[];
    function rs(){c.width=innerWidth;c.height=innerHeight;}rs();addEventListener('resize',rs);
    for(let i=0;i<110;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.2,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15,a:Math.random()*.5+.1,col:Math.random()>.6?'#5a3fa0':Math.random()>.5?'#2aa8c4':'#c8a84b'});
    (function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;if(p.y<0)p.y=c.height;if(p.y>c.height)p.y=0;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=p.col;x.globalAlpha=p.a;x.fill();});x.globalAlpha=1;requestAnimationFrame(loop);})();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
})();

/* ============================================================
   AUDIO — synthé chiptune (mélodies ORIGINALES, Web Audio API)
   ============================================================ */
const Audio8=(function(){
  let ctx=null,master=null,enabled=true,loopTimer=null,playing=null;
  const N={C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196,A3:220,B3:246.94,
    C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,
    C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,B5:987.77,R:0};
  function init(){if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();master=ctx.createGain();master.gain.value=.16;master.connect(ctx.destination);}
  function tone(f,start,dur,type,vol){if(!f)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(vol||.5,start+.01);g.gain.exponentialRampToValueAtTime(.001,start+dur);o.connect(g);g.connect(master);o.start(start);o.stop(start+dur+.02);}
  const SONGS={
    distortion:{mood:"Monde Distorsion (mystérieux)",tempo:.16,

  function playSong(name,loop){
    if(!enabled)return;init();if(ctx.state==='suspended')ctx.resume();
    const s=SONGS[name];if(!s)return;stopLoop();
    const t0=ctx.currentTime+.05,T=s.tempo;let t=t0;
    s.lead.forEach(([n,b])=>{tone(N[n],t,T*b*.95,'square',.5);t+=T*b;});
    const dur=t-t0;let tb=t0,total=0;s.bass.forEach(([n,b])=>total+=b);const u=dur/total;
    s.bass.forEach(([n,b])=>{tone(N[n],tb,u*b*.9,'triangle',.42);tb+=u*b;});
    playing=name;
    if(loop)loopTimer=setTimeout(()=>playSong(name,true),dur*1000);
  }
  function stopLoop(){if(loopTimer){clearTimeout(loopTimer);loopTimer=null;}playing=null;}
  function jingleGood(){if(!enabled)return;init();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime;tone(N.C5,t,.08,'square',.5);tone(N.E5,t+.08,.08,'square',.5);tone(N.G5,t+.16,.18,'square',.5);}
  function jingleBad(){if(!enabled)return;init();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime;tone(N.E4,t,.1,'sawtooth',.4);tone(N.C4,t+.1,.22,'sawtooth',.4);}
  function click(){if(!enabled)return;init();if(ctx.state==='suspended')ctx.resume();tone(660,ctx.currentTime,.05,'square',.28);}
  function setEnabled(v){enabled=v;if(!v)stopLoop();}
  function songMood(name){return SONGS[name]?SONGS[name].mood:"";}
  function songList(){return Object.keys(SONGS);}
  return {playSong,stopLoop,jingleGood,jingleBad,click,setEnabled,isEnabled:()=>enabled,nowPlaying:()=>playing,songMood,songList};

  {q:"Quel studio développe les jeux Pokémon principaux et leurs musiques ?",correct:"Game Freak",wrong:["HAL Laboratory","Intelligent Systems","Square Enix"],fb:"Game Freak développe la série principale ; sa petite équipe maison signe la plupart des bandes-son."},
  {q:"Le thème de combat contre quel type d'adversaire est distinct de celui des dresseurs ?",correct:"Les Pokémon sauvages",wrong:["Les soigneuses","Les marchands","Les passants"],fb:"Les combats contre les Pokémon sauvages ont leur propre thème, différent des combats de dresseurs."},
  {q:"Quelle équipe maléfique de Kanto possède son propre thème menaçant ?",correct:"La Team Rocket",wrong:["La Team Galaxie","La Team Aqua","La Team Plasma"],fb:"La Team Rocket, antagoniste de la première génération, a droit à un thème reconnaissable dans ses repaires."},
  {q:"Comment qualifie-t-on le style sonore rétro des premières musiques Pokémon ?",correct:"Le chiptune (8-bit)",wrong:["L'orchestral symphonique","Le jazz be-bop","La synthwave"],fb:"Le chiptune désigne la musique générée par les puces sonores des vieilles consoles, au son typiquement 8-bit."},
  {q:"Quel élément musical accompagne souvent l'apparition d'un Pokémon légendaire ?",correct:"Un thème solennel et dramatique propre au légendaire",wrong:["Le jingle du Centre Pokémon","Le thème du Vélo","La musique du Casino"],fb:"Les légendaires ont fréquemment leur propre thème, plus grave, soulignant l'enjeu de la rencontre."},
  {q:"Les bandes-son modernes (Switch) utilisent davantage… ?",correct:"Des arrangements orchestraux/instrumentaux",wrong:["Uniquement du 8-bit pur","Du silence total","Des bruitages seuls"],fb:"Avec les consoles récentes, les musiques se sont enrichies d'arrangements orchestraux tout en gardant des clins d'œil chiptune."},
  {q:"Dans la plupart des jeux, quel lieu a une musique calme de petit village de départ ?",correct:"Le bourg natal du joueur",wrong:["La Ligue Pokémon","La grotte finale","Le repaire de l'équipe ennemie"],fb:"Le village de départ du héros a typiquement un thème paisible qui pose l'ambiance du début d'aventure."},
  {q:"Comment appelle-t-on le bref motif sonore qui retentit quand un Pokémon apparaît au combat ?",correct:"Le cri du Pokémon",wrong:["La fanfare de niveau","Le thème de la zone","Le bip de menu"],fb:"Chaque espèce possède un cri distinct ; sur Game Boy, ces cris étaient de courts effets sonores synthétisés."},
  {q:"Quel moment de jeu déclenche en général une courte fanfare ascendante de récompense ?",correct:"La montée de niveau / l'obtention d'un badge",wrong:["L'entrée dans une grotte","Le fait de marcher dans l'herbe","L'ouverture du sac"],fb:"Les fanfares ascendantes marquent les récompenses : montée de niveau, badge d'arène, objet rare obtenu."}
];

/* ============================================================
   HELPERS
   ============================================================ */
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const rand=a=>a[Math.floor(Math.random()*a.length)];
function otherNames(ex,n=3){return shuffle(ALL_NAMES.filter(x=>x!==ex)).slice(0,n);}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function decodeHtml(s){const t=document.createElement("textarea");t.innerHTML=s;return t.value;}
function spriteHTML(p,silhouette){
  const ani="https://play.pokemonshowdown.com/sprites/ani/"+p.slug+".gif";
  const home="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/"+p.id+".png";
  const art="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/"+p.id+".png";
  return '<img class="q-sprite'+(silhouette?" silhouette":"")+'" alt="'+escapeHtml(p.name)+'" src="'+ani+'" data-home="'+home+'" data-art="'+art+'" data-step="0" '+
    'onerror="var s=this.dataset.step;if(s===\'0\'){this.dataset.step=\'1\';this.src=this.dataset.home;}else if(s===\'1\'){this.dataset.step=\'2\';this.src=this.dataset.art;}else{this.style.display=\'none\';}">';
}
function spawnSparkles(el){
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cont=document.getElementById("sparkles");if(!cont)return;
  for(let i=0;i<14;i++){const sp=document.createElement("div");sp.className="sparkle";const a=(i/14)*Math.PI*2,d=40+Math.random()*50;
    sp.style.cssText="left:"+cx+"px;top:"+cy+"px;--tx:"+Math.cos(a)*d+"px;--ty:"+Math.sin(a)*d+"px;background:"+(Math.random()>.5?"#c8a84b":"#4fcfea")+";animation-delay:"+Math.random()*.2+"s;";
    cont.appendChild(sp);setTimeout(()=>sp.remove(),1000);}
}

/* ============================================================
   MOTEUR DE QUIZ réutilisable
   GAME = { title, subtitle, ambiance, difficulties:[...], makeQuestion(), hints }
   difficulties: tableau de clés parmi DIFFS, ou objets custom
   ============================================================ */
const DIFFS={
  sprint:{key:"sprint",icon:"&#9889;",label:"Sprint",desc:"10 questions, rapide",n:10},
  defi:{key:"defi",icon:"&#128293;",label:"Défi",desc:"20 questions",n:20},
  marathon:{key:"marathon",icon:"&#128142;",label:"Marathon",desc:"50 questions",n:50},
  infini:{key:"infini",icon:"&#8734;",label:"Infini",desc:"Sans fin — joue jusqu'à abandonner",n:0,cls:"infinite"},
  survie:{key:"survie",icon:"&#10084;",label:"Survie",desc:"3 vies · 12s par question",n:0,lives:3,timer:12,cls:"survie"}
};

const Quiz=(function(){
  let G=null;
  let st={};
  let timerInt=null;

  function mount(gameConfig){
    G=gameConfig;
    G.difficulties=(G.difficulties||["sprint","defi","marathon","infini"]).map(d=>typeof d==="string"?DIFFS[d]:d);
    const app=document.getElementById("app");
    app.innerHTML=
      // start
      '<div id="q-start" class="screen active"><div class="start-wrap">'+
        '<p class="sec-title">'+(G.eyebrow||"Choisis ton épreuve")+'</p>'+
        '<h1 class="sec-head">'+G.title+'</h1>'+
        '<p class="sec-sub">'+(G.subtitle||"")+'</p>'+
        (G.intro||"")+
        '<div class="sep"></div>'+
        '<div class="mode-cards" id="q-modes"></div>'+
        '<a class="res-btn secondary" href="index.html">&#8592; Menu principal</a>'+
      '</div></div>'+
      // game
      '<div id="q-game" class="screen"><div class="game-wrap">'+
        '<div class="game-header">'+
          '<button class="back-btn" id="q-quit">&#8592; Quitter</button>'+
          '<div class="game-info" id="q-info"></div>'+
        '</div>'+
        '<div class="progress-wrap"><div class="progress-fill" id="q-progress" style="width:0%"></div></div>'+
        '<div id="q-area"></div>'+
      '</div></div>'+
      // results
      '<div id="q-results" class="screen"><div class="results-wrap">'+
        '<div class="orb"><span class="big" id="q-pct">0%</span><span class="sub">PRÉCISION</span></div>'+
        '<h2 class="res-title" id="q-rtitle"></h2><p class="res-flavor" id="q-rflavor"></p>'+
        '<div class="sep"></div>'+
        '<div class="res-break" id="q-break"></div>'+
        '<div class="res-btns">'+
          '<button class="res-btn primary" id="q-replay">Rejouer</button>'+
          '<button class="res-btn secondary" id="q-change">Changer de mode</button>'+
          '<a class="res-btn secondary" href="index.html">Menu</a>'+
        '</div>'+
      '</div></div>';

    const modes=document.getElementById("q-modes");
    G.difficulties.forEach(d=>{
      const c=document.createElement("div");c.className="mode-card"+(d.cls?(" "+d.cls):"");
      c.innerHTML='<span class="mi">'+d.icon+'</span><p class="mn">'+d.label+'</p><p class="md">'+d.desc+'</p>';
      c.addEventListener("click",()=>{Audio8.click();start(d);});
      modes.appendChild(c);
    });
    document.getElementById("q-quit").addEventListener("click",quit);
    document.getElementById("q-replay").addEventListener("click",()=>{Audio8.click();start(st.diff);});
    document.getElementById("q-change").addEventListener("click",()=>{Audio8.click();Audio8.stopLoop();showS("q-start");});
  }

  function showS(id){document.querySelectorAll("#app .screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");scrollTo(0,0);}

  function start(d){
    st={diff:d,total:d.n===0?Infinity:d.n,infinite:d.n===0,lives:d.lives||0,maxLives:d.lives||0,
        timer:d.timer||0,score:0,streak:0,best:0,i:0,wrong:0,answered:false,hintUsed:false};
    if(G.ambiance)Audio8.playSong(G.ambiance,true);
    showS("q-game");
    render();
  }

  function quit(){
    if(st.i>0){
      if(st.infinite||st.lives){ if(confirm("Terminer la partie et voir ton score ?")) return results(); return; }
      if(!confirm("Abandonner cette partie ? Tes progrès seront perdus."))return;
    }
    Audio8.stopLoop();showS("q-start");
  }

  function render(){
    clearTimer();
    st.answered=false;st.hintUsed=false;
    const q=G.makeQuestion(st);
    st.current=q;

    // header info
    const info=document.getElementById("q-info");
    let h="";
    h+='<div class="chip">QUESTION<span>'+(st.infinite?("&#8734; "+(st.i+1)):((st.i+1)+"/"+st.total))+'</span></div>';
    h+='<div class="chip">SCORE<span>'+st.score+'</span></div>';
    if(st.maxLives)h+='<div class="chip lives">VIES<span>'+("&#10084;".repeat(st.lives)||"—")+'</span></div>';
    if(st.timer)h+='<div class="chip timer">TEMPS<span id="q-time">'+st.timer+'</span></div>';
    if(st.streak>=3)h+='<div class="streak-badge">&#128293; '+st.streak+' série&#8201;!</div>';
    info.innerHTML=h;

    // progress
    const pg=document.getElementById("q-progress");
    if(st.infinite){pg.className="progress-fill";pg.style.width=((st.i%20)/20*100)+"%";}
    else{pg.className="progress-fill";pg.style.width=(st.i/st.total*100)+"%";}

    // body
    const answers=q.answers.map((a,i)=>'<button class="answer-btn" data-val="'+escapeHtml(a)+'"><span class="al">'+["A","B","C","D","E"][i]+'</span>'+escapeHtml(a)+'</button>').join("");
    const hintRow=(G.hints&&q.hint)?'<div class="hint-row"><button class="hint-btn" id="q-hint">&#128161; Indice</button></div><div class="hint-text" id="q-hinttext" style="display:none"></div>':"";
    document.getElementById("q-area").innerHTML=
      '<div class="q-card">'+(q.badge||"")+
        '<p class="q-tlabel">'+(q.tlabel||"")+'</p>'+
        '<p class="q-text">'+q.text+'</p>'+(q.media||"")+
      '</div>'+
      '<div class="answers-grid" id="q-answers">'+answers+'</div>'+hintRow+
      '<div class="feedback" id="q-feedback"></div>'+
      '<button class="next-btn" id="q-next"></button>';

    document.querySelectorAll("#q-answers .answer-btn").forEach(b=>b.addEventListener("click",()=>choose(b)));
    document.getElementById("q-next").addEventListener("click",next);
    if(G.hints&&q.hint){document.getElementById("q-hint").addEventListener("click",useHint);}
    if(q.onMounted)q.onMounted(q);
    if(st.timer)startTimer();
  }

  function startTimer(){
    let t=st.timer;const el=document.getElementById("q-time");
    const pg=document.getElementById("q-progress");pg.className="progress-fill timer";pg.style.width="100%";
    timerInt=setInterval(()=>{
      t--;if(el)el.textContent=t;pg.style.width=(t/st.timer*100)+"%";
      if(t<=0){clearTimer();timeout();}
    },1000);
  }
  function clearTimer(){if(timerInt){clearInterval(timerInt);timerInt=null;}}

  function useHint(){
    if(st.answered||st.hintUsed)return;st.hintUsed=true;
    const ht=document.getElementById("q-hinttext");ht.style.display="block";ht.textContent=st.current.hint;
    document.getElementById("q-hint").disabled=true;Audio8.click();
  }

  function lockAnswers(){
    document.querySelectorAll("#q-answers .answer-btn").forEach(b=>{
      b.disabled=true;if(decodeHtml(b.dataset.val)===st.current.correct)b.classList.add("correct");
    });
  }

  function timeout(){
    if(st.answered)return;st.answered=true;
    lockAnswers();
    st.streak=0;st.wrong++;if(st.maxLives)st.lives--;
    const fb=document.getElementById("q-feedback");
    fb.className="feedback wrong";
    fb.innerHTML='<span class="fl">&#10022; Temps écoulé</span><span class="ft">'+st.current.fbw+'</span>';
    Audio8.jingleBad();
    finishTurn();
  }

  function choose(btn){
    if(st.answered)return;st.answered=true;clearTimer();
    const q=st.current;const ok=decodeHtml(btn.dataset.val)===q.correct;
    lockAnswers();
    const fb=document.getElementById("q-feedback");
    if(ok){
      btn.classList.add("correct");
      if(!st.hintUsed)st.score++;else st.score++; // l'indice n'enlève pas le point, juste la "perfection"
      st.streak++;st.best=Math.max(st.best,st.streak);
      fb.className="feedback correct";
      fb.innerHTML='<span class="fl">&#10022; Correct&#8201;!'+(st.hintUsed?" (avec indice)":"")+'</span><span class="ft">'+q.fbc+'</span>';
      Audio8.jingleGood();spawnSparkles(btn);
      const sp=document.querySelector("#q-area .q-sprite");if(sp){sp.classList.remove("silhouette");sp.classList.add("reveal");}
    }else{
      btn.classList.add("wrong");st.streak=0;st.wrong++;if(st.maxLives)st.lives--;
      fb.className="feedback wrong";
      fb.innerHTML='<span class="fl">&#10022; Incorrect</span><span class="ft">'+q.fbw+'</span>';
      Audio8.jingleBad();
      const sp=document.querySelector("#q-area .q-sprite");if(sp){sp.classList.remove("silhouette");}
    }
    finishTurn();
  }

  function finishTurn(){
    document.getElementById("q-info").querySelector(".chip span").innerHTML=st.infinite?("&#8734; "+(st.i+1)):((st.i+1)+"/"+st.total);
    const lv=document.querySelector("#q-info .lives span");if(lv)lv.innerHTML="&#10084;".repeat(st.lives)||"—";
    const nb=document.getElementById("q-next");
    if(st.maxLives&&st.lives<=0){nb.textContent="Game Over → résultats →";}
    else nb.textContent=(!st.infinite&&st.i+1>=st.total)?"Voir les résultats →":"Question suivante →";
    nb.style.display="block";
  }

  function next(){
    Audio8.click();
    if(st.maxLives&&st.lives<=0)return results();
    st.i++;
    if(!st.infinite&&st.i>=st.total)return results();
    render();
  }

  function results(){
    clearTimer();Audio8.stopLoop();
    const total=st.infinite?st.i:(st.maxLives?st.i+ (st.lives<=0?1:0):st.total);
    const answered=st.infinite?st.i:(st.maxLives? (st.score+st.wrong):st.total);
    const denom=Math.max(1,(st.score+st.wrong));
    const pct=Math.round(st.score/denom*100);
    document.getElementById("q-pct").textContent=pct+"%";
    const t=tier(pct);
    document.getElementById("q-rtitle").textContent=t[0];
    document.getElementById("q-rflavor").textContent=t[1];
    document.getElementById("q-break").innerHTML=
      '<div class="bi"><span class="num" style="color:var(--gira-teal-bright)">'+st.score+'</span><span class="lbl">Correct</span></div>'+
      '<div class="bi"><span class="num" style="color:#ff8080">'+st.wrong+'</span><span class="lbl">Raté</span></div>'+
      '<div class="bi"><span class="num" style="color:var(--gira-gold)">'+st.best+'</span><span class="lbl">Meilleure série</span></div>';
    showS("q-results");
  }
  function tier(p){
    if(p>=90)return ["Maître Pokémon","Giratina lui-même s'incline devant ta connaissance légendaire."];
    if(p>=70)return ["Dresseur Expert","Une maîtrise digne d'un Champion d'Arène."];
    if(p>=50)return ["Dresseur Confirmé","Continue ton voyage, la Ligue Pokémon t'attend."];
    if(p>=30)return ["Jeune Dresseur","Retourne t'entraîner — l'aventure ne fait que commencer."];
    return ["Néophyte du Vide","Giratina t'invite à explorer le Monde Distorsion davantage…"];
  }

  return {mount,DIFFS};
})();

/* badge helper pour les jeux à sprite */
function pkmnBadge(p,hidden){
  if(!p)return "";
  const c=typeColor(p.type[0]);
  return '<div class="q-badge" style="background:'+c+'22;color:'+c+';border:.5px solid '+c+'55;">'+(hidden?"? ? ?":escapeHtml(p.name))+'</div>';
}
function soundBadge(){return '<div class="q-badge" style="background:rgba(42,168,196,.13);color:var(--gira-teal-bright);border:.5px solid rgba(42,168,196,.4);">&#127925; Bande-son</div>';}
function typeBadge(label){return '<div class="q-badge" style="background:rgba(200,168,75,.13);color:var(--gira-gold);border:.5px solid rgba(200,168,75,.4);">&#9889; '+label+'</div>';}

</script>
<script>
const ALL_MOVES=[...new Set(PLAYABLE.flatMap(p=>p.moves))];
const withMoves=PLAYABLE.filter(p=>p.moves&&p.moves.length>=3);

function qPeutUtiliser(){
  const p=rand(PLAYABLE);
  const mv=rand(p.moves);
  const wrong=shuffle(ALL_MOVES.filter(m=>!p.moves.includes(m))).slice(0,3);
  return {badge:pkmnBadge(p,false),tlabel:"— Capacités —",
    text:"Laquelle de ces capacités "+p.name+" peut-il utiliser&#8201;?",
    media:'<div class="q-sprite-stage">'+spriteHTML(p,false)+'</div>',
    answers:shuffle([mv,...wrong]),correct:mv,
    fbc:"Oui&#8201;! "+p.name+" maîtrise "+mv+" (signature : "+p.sig+").",
    fbw:"Non — "+p.name+" connaît : "+p.moves.join(", ")+"."};
}
function qSignature(){
  const p=rand(PLAYABLE);
  const wrong=shuffle(ALL_MOVES.filter(m=>m!==p.sig&&!p.moves.includes(m))).slice(0,3);
  return {badge:pkmnBadge(p,false),tlabel:"— Capacité signature —",
    text:"Quelle est la capacité emblématique de "+p.name+"&#8201;?",
    media:'<div class="q-sprite-stage">'+spriteHTML(p,false)+'</div>',
    answers:shuffle([p.sig,...wrong]),correct:p.sig,
    fbc:"Exact&#8201;! La signature de "+p.name+" est "+p.sig+".",
    fbw:"Non — la signature de "+p.name+" est "+p.sig+"."};
}
function qIntrus(){
  const p=rand(withMoves);
  const trio=shuffle(p.moves).slice(0,3);
  const intrus=rand(ALL_MOVES.filter(m=>!p.moves.includes(m)));
  return {badge:pkmnBadge(p,false),tlabel:"— Trouve l'intrus —",
    text:"Quelle capacité "+p.name+" ne peut-il PAS utiliser&#8201;?",
    media:'<div class="q-sprite-stage">'+spriteHTML(p,false)+'</div>',
    answers:shuffle([...trio,intrus]),correct:intrus,
    fbc:"Bien vu&#8201;! "+p.name+" ne connaît pas "+intrus+". Ses capacités : "+p.moves.join(", ")+".",
    fbw:"Raté — "+p.name+" connaît bien celle-là. L'intrus était "+intrus+"."};
}
function qDeQui(){
  // attaque signature -> de quel Pokémon ?
  const p=rand(PLAYABLE);
  const wrong=otherNames(p.name,3);
  return {badge:typeBadge("Capacité signature"),tlabel:"— À qui est cette capacité&#8201;? —",
    text:"« "+p.sig+" » est la capacité signature de quel Pokémon&#8201;?",
    answers:shuffle([p.name,...wrong]),correct:p.name,
    fbc:"Oui&#8201;! "+p.sig+" est associé à "+p.name+".",
    fbw:"C'était "+p.name+" qui est connu pour "+p.sig+"."};
}

const GAME={
  title:"Capacités Pokémon",
  subtitle:"Attaques, capacités signatures et intrus : connais-tu vraiment l'arsenal de chaque Pokémon&#8201;?",
  eyebrow:"Mouvements & attaques",
  ambiance:"battle",
  difficulties:["sprint","defi","marathon","infini","survie"],
  makeQuestion(st){
    return rand([qPeutUtiliser,qSignature,qIntrus,qDeQui])();
  }
};
Quiz.mount(GAME);
</script>
